
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkoVision Ghost Overlay</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <img src="/overlays/ghost-banner.png"
       alt="DarkoVision Ghost Banner">
</body>
</html>
